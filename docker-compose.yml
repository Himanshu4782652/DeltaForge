services:
  db:
    image: postgres:16-alpine
    container_name: deltaforge_postgres
    restart: always
    environment:
      POSTGRES_DB: deltaforge_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: deltaforge_redis
    restart: always
    ports:
      - "6379:6379"

  django_web:
    build: .
    container_name: deltaforge_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=deltaforge_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - REDIS_URL=redis://redis:6379/0
      - FASTAPI_URL=http://fastapi_engine:8001
    depends_on:
      - db
      - redis

  fastapi_engine:
    build: .
    container_name: deltaforge_fastapi
    command: uvicorn fastapi_app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
